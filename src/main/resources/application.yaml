spring:
  application:
    name: inframanager

  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      auto-commit: false
      minimum-idle: 5
      idle-timeout: 300000 #5 min
      max-lifetime: 18000000 #30 min
      connection-timeout: 30000 #3s
      leak-detection-threshold: 2000 #2s

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false


  jackson:
    time-zone: UTC
    default-property-inclusion: non_null



server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  exp: ${JWT_EXP}